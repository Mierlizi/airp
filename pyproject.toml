[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airp-local"
version = "0.7.1"
description = "Local incremental multi-language program intelligence for coding agents"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Mierlizi"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/Mierlizi/airp"
Repository = "https://github.com/Mierlizi/airp"
Issues = "https://github.com/Mierlizi/airp/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
test = ["pytest>=8,<9"]
universal = ["tree-sitter-language-pack>=1.1,<2"]
tokens = ["tiktoken>=0.9,<1"]

[project.scripts]
airp = "airp.cli:main"

[tool.setuptools.packages.find]
include = ["airp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
